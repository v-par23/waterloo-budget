<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #ece7da;
          font-family: "Space Mono", monospace;
          overflow: hidden;
        }
        #root .s3-street {
          position: absolute;
          background: rgba(27, 26, 23, 0.09);
        }
        #root .s3-block {
          position: absolute;
          border-radius: 28px;
          background: rgba(27, 26, 23, 0.045);
        }
        #root .s3-caption {
          position: absolute;
          top: 90px;
          left: 0;
          right: 0;
          text-align: center;
          font-size: 30px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: #1b1a17;
        }
        #root .s3-label {
          position: absolute;
          left: 50%;
          top: 660px;
          width: 420px;
          margin-left: -210px;
          text-align: center;
          font-size: 24px;
          font-weight: 700;
          color: rgba(27, 26, 23, 0.55);
          letter-spacing: 0.04em;
        }
        #root .s3-marker {
          position: absolute;
          border-radius: 50%;
          background: #1b1a17;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #root .s3-marker svg {
          stroke: #f3efe4;
          fill: none;
          stroke-width: 1.6;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
      </style>

      <div id="root" data-composition-id="scene3" data-width="1920" data-height="1080" data-duration="4">
        <!-- abstract map dressing -->
        <div class="s3-street" style="left:0; top:520px; width:1920px; height:6px; transform:rotate(-4deg);"></div>
        <div class="s3-street" style="left:940px; top:0; width:6px; height:1080px; transform:rotate(8deg);"></div>
        <div class="s3-block" style="left:120px; top:120px; width:420px; height:300px;"></div>
        <div class="s3-block" style="left:1380px; top:640px; width:380px; height:320px;"></div>

        <div class="s3-caption" id="s3-caption">See it on the map.</div>
        <div class="s3-label" id="s3-label">University of Waterloo</div>

        <!-- secondary, already-settled markers -->
        <div class="s3-marker" id="s3-marker-a" style="left:668px; top:528px; width:64px; height:64px;">
          <svg viewBox="0 0 20 20" width="26" height="26">
            <polyline points="4,10 10,4 16,10" />
            <path d="M6 9v7h8V9" />
          </svg>
        </div>
        <div class="s3-marker" id="s3-marker-b" style="left:1188px; top:388px; width:64px; height:64px;">
          <svg viewBox="0 0 20 20" width="26" height="26">
            <path d="M5 8h9v5a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V8Z" />
            <path d="M14 9.5h1.5a2 2 0 0 1 0 4H14" />
            <line x1="7" y1="4" x2="7" y2="6" />
            <line x1="10" y1="4" x2="10" y2="6" />
          </svg>
        </div>

        <!-- hero: the food category marker, drops in and lands -->
        <div class="s3-marker" id="s3-marker-food" style="left:910px; top:430px; width:100px; height:100px;">
          <svg viewBox="0 0 20 20" width="44" height="44">
            <circle cx="10" cy="12" r="6" />
            <line x1="3.5" y1="1.5" x2="3.5" y2="5.5" />
            <line x1="5.5" y1="1.5" x2="5.5" y2="5.5" />
            <line x1="7.5" y1="1.5" x2="7.5" y2="5.5" />
            <path d="M3.5 5.5c0 2 1.5 2.5 2 2.5s2-.5 2-2.5" />
            <line x1="5.5" y1="8" x2="5.5" y2="18" />
            <path d="M14.5 1.3L15.6 7.7H13.4Z" />
            <line x1="14.5" y1="7.7" x2="14.5" y2="18" />
          </svg>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#s3-caption",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          0.0,
        );
        tl.fromTo(
          ["#s3-marker-a", "#s3-marker-b", "#s3-label"],
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out" },
          0.15,
        );
        // hero marker drops in, lands/settles at local 1.46s = global 8.96s (beat-locked strong cue)
        tl.fromTo(
          "#s3-marker-food",
          { opacity: 0, y: -70, scale: 0.85 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" },
          1.01,
        );
        window.__timelines["scene3"] = tl;
      </script>
    </template>
  </body>
</html>
