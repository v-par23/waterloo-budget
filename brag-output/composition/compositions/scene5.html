<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #f3efe4;
          font-family: "Space Mono", monospace;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        #root .s5-wrap {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #root .s5-word {
          font-weight: 700;
          font-size: 110px;
          line-height: 0.98;
          letter-spacing: 0.01em;
          text-align: center;
        }
        #root #s5-word-top {
          color: #1b1a17;
        }
        #root #s5-word-bottom {
          color: #ff5a1f;
        }
        #root #s5-tagline {
          margin-top: 34px;
          font-size: 32px;
          font-weight: 400;
          color: #1b1a17;
        }
        #root #s5-cta {
          margin-top: 22px;
          font-size: 24px;
          font-weight: 700;
          color: rgba(27, 26, 23, 0.55);
          letter-spacing: 0.03em;
        }
      </style>

      <div id="root" data-composition-id="scene5" data-width="1920" data-height="1080" data-duration="3">
        <div class="s5-wrap">
          <div class="s5-word" id="s5-word-top">WATERLOO</div>
          <div class="s5-word" id="s5-word-bottom">BUDGET</div>
          <div id="s5-tagline">Built for students who check the receipt.</div>
          <div id="s5-cta">Live now &mdash; waterloo-budget.vercel.app</div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // wordmark settles at local ~0.55s = global 16.55s (matches the outro bell SFX)
        tl.fromTo(
          "#s5-word-top",
          { opacity: 0, y: 22, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
          0.1,
        );
        tl.fromTo(
          "#s5-word-bottom",
          { opacity: 0, y: 22, scale: 0.94 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
          0.15,
        );
        tl.fromTo(
          "#s5-tagline",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          0.75,
        );
        tl.fromTo(
          "#s5-cta",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          1.35,
        );
        window.__timelines["scene5"] = tl;
      </script>
    </template>
  </body>
</html>
