<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #f3efe4;
          font-family: "Space Mono", monospace;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 48px;
        }
        #root .s2-caption {
          font-size: 30px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: #1b1a17;
        }
        #root .s2-card {
          width: 700px;
          background: #f3efe4;
          border: 3px solid #1b1a17;
          box-shadow: 12px 12px 0 #1b1a17;
          padding: 44px;
        }
        #root .s2-row-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        #root .s2-tag {
          display: inline-block;
          background: #1b1a17;
          color: #f3efe4;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          padding: 8px 18px;
        }
        #root .s2-price {
          font-size: 34px;
          font-weight: 700;
          color: #ff5a1f;
        }
        #root .s2-title {
          margin-top: 26px;
          font-size: 48px;
          font-weight: 700;
          color: #1b1a17;
        }
        #root .s2-meta {
          margin-top: 10px;
          font-size: 24px;
          color: rgba(27, 26, 23, 0.55);
        }
        #root .s2-vibe {
          margin-top: 18px;
          display: flex;
          align-items: center;
          gap: 12px;
        }
        #root .s2-vibe-dot {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: #ff5a1f;
        }
        #root .s2-vibe-label {
          font-size: 18px;
          font-weight: 700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: rgba(27, 26, 23, 0.5);
        }
        #root .s2-desc {
          margin-top: 20px;
          font-size: 26px;
          color: rgba(27, 26, 23, 0.85);
        }
        #root .s2-divider {
          margin-top: 28px;
          border-top: 2px dashed #1b1a17;
        }
        #root .s2-btn {
          margin-top: 24px;
          border: 3px solid #1b1a17;
          text-align: center;
          padding: 18px;
          font-size: 24px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #1b1a17;
        }
      </style>

      <div id="root" data-composition-id="scene2" data-width="1920" data-height="1080" data-duration="4.5">
        <div class="s2-caption" id="s2-caption">Budget-friendly spots. Curated, not crowdsourced.</div>
        <div class="s2-card" id="s2-card">
          <div class="s2-row-top">
            <span class="s2-tag">Food</span>
            <span class="s2-price">~$11</span>
          </div>
          <div class="s2-title">Mozy's Shawarma</div>
          <div class="s2-meta">Uptown Waterloo &middot; Middle Eastern</div>
          <div class="s2-vibe">
            <span class="s2-vibe-dot"></span>
            <span class="s2-vibe-label">Usually busy</span>
          </div>
          <div class="s2-desc">Huge portions shawarma</div>
          <div class="s2-divider"></div>
          <div class="s2-btn" id="s2-btn">$ Log spend</div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#s2-caption",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          0.0,
        );
        // card lands/settles at local 0.70s = global 3.70s (beat-locked strong cue)
        tl.fromTo(
          "#s2-card",
          { opacity: 0, y: 55 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.2,
        );
        tl.fromTo("#s2-btn", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.9);
        window.__timelines["scene2"] = tl;
      </script>
    </template>
  </body>
</html>
