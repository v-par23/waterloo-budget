<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #f3efe4;
          font-family: "Space Mono", monospace;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #root .s1-wrap {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #root .s1-word {
          font-weight: 700;
          font-size: 132px;
          line-height: 0.98;
          letter-spacing: 0.01em;
          text-align: center;
        }
        #root #s1-word-top {
          color: #1b1a17;
        }
        #root #s1-word-bottom {
          color: #ff5a1f;
        }
        #root #s1-rule {
          width: 720px;
          height: 0;
          border-top: 4px dashed #1b1a17;
          margin-top: 40px;
          transform-origin: left center;
        }
        #root #s1-tagline {
          margin-top: 36px;
          font-size: 34px;
          font-weight: 400;
          color: #1b1a17;
          letter-spacing: 0.02em;
        }
      </style>

      <div id="root" data-composition-id="scene1" data-width="1920" data-height="1080" data-duration="3">
        <div class="s1-wrap">
          <div class="s1-word" id="s1-word-top">WATERLOO</div>
          <div class="s1-word" id="s1-word-bottom">BUDGET</div>
          <div id="s1-rule"></div>
          <div id="s1-tagline">A receipt for your life in Waterloo.</div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#s1-word-top",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          0.0,
        );
        tl.fromTo(
          "#s1-word-bottom",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          0.08,
        );
        // beat context: scene starts at global 0.0, sfx-hook fires at global 0.35 (local 0.35)
        tl.fromTo("#s1-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.55);
        tl.fromTo(
          "#s1-tagline",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          0.95,
        );
        window.__timelines["scene1"] = tl;
      </script>
    </template>
  </body>
</html>
