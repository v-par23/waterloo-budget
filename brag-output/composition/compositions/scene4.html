<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #f3efe4;
          font-family: "Space Mono", monospace;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 48px;
        }
        #root .s4-caption {
          font-size: 30px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: #1b1a17;
        }
        #root .s4-card {
          width: 760px;
          background: #f3efe4;
          border: 3px solid #1b1a17;
          box-shadow: 12px 12px 0 #1b1a17;
          padding: 44px;
        }
        #root .s4-row-top {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
        }
        #root .s4-title {
          font-size: 40px;
          font-weight: 700;
          color: #1b1a17;
        }
        #root .s4-amount {
          font-size: 40px;
          font-weight: 700;
          color: #ff5a1f;
        }
        #root .s4-meta {
          margin-top: 8px;
          font-size: 22px;
          color: rgba(27, 26, 23, 0.55);
        }
        #root .s4-divider {
          margin: 24px 0;
          border-top: 2px dashed #1b1a17;
        }
        #root .s4-member {
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-size: 26px;
          color: #1b1a17;
          padding: 10px 0;
        }
        #root .s4-member-right {
          display: flex;
          align-items: center;
          gap: 16px;
        }
        #root .s4-settled {
          font-size: 16px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          border: 2px solid #1b1a17;
          padding: 4px 10px;
          color: #1b1a17;
        }
      </style>

      <div id="root" data-composition-id="scene4" data-width="1920" data-height="1080" data-duration="4.5">
        <div class="s4-caption" id="s4-caption">Log spend. Split with your team.</div>
        <div class="s4-card" id="s4-card">
          <div class="s4-row-top">
            <span class="s4-title">dinner</span>
            <span class="s4-amount">$5.00</span>
          </div>
          <div class="s4-meta">Paid by Virat &middot; Sep 10</div>
          <div class="s4-divider"></div>
          <div class="s4-member">
            <span>user dummy</span>
            <span class="s4-member-right">
              <span>$1.67</span>
              <span class="s4-settled" id="s4-settled-1">Settled</span>
            </span>
          </div>
          <div class="s4-member">
            <span>dummy user</span>
            <span class="s4-member-right">
              <span>$1.67</span>
              <span class="s4-settled" id="s4-settled-2">Settled</span>
            </span>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#s4-caption",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          0.0,
        );
        tl.fromTo(
          "#s4-card",
          { opacity: 0, y: 55 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.2,
        );
        // first SETTLED tag lands at local 1.15s = global 12.65s (beat-locked strong cue)
        tl.fromTo(
          "#s4-settled-1",
          { opacity: 0, scale: 0.7 },
          { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" },
          0.9,
        );
        // second SETTLED tag follows naturally, ~0.35s later
        tl.fromTo(
          "#s4-settled-2",
          { opacity: 0, scale: 0.7 },
          { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" },
          1.25,
        );
        window.__timelines["scene4"] = tl;
      </script>
    </template>
  </body>
</html>
